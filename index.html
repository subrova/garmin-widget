<!doctype html>
<html lang="cs"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f141b" media="(prefers-color-scheme: dark)"><meta name="theme-color" content="#eef1f5" media="(prefers-color-scheme: light)">

<link rel="manifest" href="manifest.json">

<body><div id="garmin-widget" data-lang="cs" data-src="data.json" data-refresh-url="refresh"></div>
